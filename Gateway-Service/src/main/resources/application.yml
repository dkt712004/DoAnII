server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:

          discovery:
            locator:
              enabled: true

          # --- ĐỊNH NGHĨA TUYẾN ĐƯỜNG (ROUTES) ---
          routes: # Thuộc tính này cũng nằm trong server.webflux

            # 1. Route cho Authentication Service
            - id: auth-service-route
              uri: lb://authentication-service
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/(?<segment>.*), /$\{segment}

            # 2. Route cho User Service
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
              filters:
                - RewritePath=/api/user/(?<segment>.*), /$\{segment}


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/